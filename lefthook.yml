# Git hooks managed by lefthook (installed via mise: `mise install`).
pre-commit:
  piped: true # run in order; stop at the first failure
  commands:
    clippy-fix:
      priority: 1
      glob: "*.rs"
      run: cargo clippy --fix --allow-dirty --allow-staged --all-targets --locked --quiet
      stage_fixed: true
    fmt:
      priority: 2
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    clippy:
      priority: 3
      glob: "*.rs"
      run: cargo clippy --all-targets --locked --quiet -- -D warnings
